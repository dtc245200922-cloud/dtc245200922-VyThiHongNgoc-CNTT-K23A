server {
    listen 80;
    server_name localhost;

    # Ẩn phiên bản Nginx
    server_tokens off;

    # Giới hạn kích thước tải lên
    client_max_body_size 32m;

    # Giới hạn thời gian chờ từ client
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Các security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Chặn truy cập tệp ẩn, ngoại trừ thư mục .well-known
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Chặn các đường dẫn cấu hình nhạy cảm
    location ~* ^/(?:wp-config\.php|readme\.html|license\.txt)$ {
        deny all;
    }

    location / {
        proxy_pass http://wordpress:80;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ẩn thông tin phiên bản PHP từ upstream
        proxy_hide_header X-Powered-By;
    }
}