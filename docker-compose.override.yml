services:
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "127.0.0.1:8182:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - app-network
      - db-network
    depends_on:
      - mysql
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8280:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
      - monitoring
    depends_on:
      - wordpress
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    user: "65534:65534"
    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"
    networks:
      - monitoring
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command:
      - "-config.file=/etc/loki/config.yml"
    ports:
      - "127.0.0.1:3200:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.0
    user: "0:0"
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/positions
    networks:
      - monitoring
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  loki-data:
  promtail-data: