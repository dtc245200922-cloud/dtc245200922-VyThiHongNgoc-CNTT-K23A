services:
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "127.0.0.1:8182:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - db-network
    depends_on:
      - mysql
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8280:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - wordpress
    restart: unless-stopped